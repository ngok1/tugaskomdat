<!DOCTYPE html>
<html>

<head>

<title>
Smart Curtain Dashboard
</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<style>

body{
font-family:Arial,sans-serif;
background:#eef2f7;
margin:0;
padding:15px;
color:#222;
}


.header{

background:white;
padding:20px;
border-radius:15px;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:0 3px 10px #ddd;

}


.card{

background:white;
margin-top:15px;
padding:20px;

border-radius:15px;

box-shadow:
0 3px 10px #ddd;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:15px;

}



input,button,select{

padding:12px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

}



button{

background:#2563eb;
color:white;
border:none;
cursor:pointer;

}



.online{

color:green;
font-weight:bold;

}



.offline{

color:red;
font-weight:bold;

}



.curtains{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}



.curtain{

background:#f8fafc;

padding:15px;

border-radius:12px;

}



.bar{

height:15px;

background:#ddd;

border-radius:20px;

overflow:hidden;

}



.fill{

height:100%;

background:#2563eb;

transition:1s;

}



.badge{

display:inline-block;

padding:5px 12px;

background:#dbeafe;

border-radius:20px;

}



canvas{

width:100%;

}



.menu a{

margin-right:15px;

text-decoration:none;

}


</style>


</head>



<body>




<div class="header">


<div>

<h1>
🏠 Smart Curtain
</h1>


<p>
MQTT Local Smart Home
</p>


</div>


<div align="right">


<div id="clock">
00:00:00
</div>


<div id="date">
-
</div>


</div>


</div>









<div class="card">


<h2>
MQTT Broker Setting
</h2>


<input id="broker"
placeholder="192.168.1.10">



<button onclick="saveBroker()">
CONNECT BROKER
</button>



<p>

Status:

<span id="mqtt">
Checking...
</span>

</p>



<p>

ESP32 IP:

<span id="esp">
-
</span>


</p>


</div>









<div class="grid">



<div class="card">


<h2>
Weather ☀️
</h2>


<h1 id="temp">
30°C
</h1>


<p id="weather">
Sunny
</p>


<p>

Humidity:

<span id="humidity">
65
</span>

%

</p>



</div>







<div class="card">


<h2>
System
</h2>


<p>

WiFi:

<span class="online">
Connected
</span>


</p>


<p>

MQTT:

<span id="mqtt2">
-
</span>


</p>


<p>

Broker:

<span id="brokerView">
-
</span>


</p>


</div>



</div>









<div class="card">


<h2>
Curtain Overview
</h2>


<div class="curtains"
id="curtainBox">

</div>


</div>








<div class="card">


<h2>
Position History
</h2>


<canvas id="chart"
height="120">

</canvas>


</div>








<div class="card menu">

<a href="/control.html">
🎛 Control
</a>


<a href="/status.html">
📊 Status
</a>

</div>








<script>


let history=[];



// CLOCK

function clock()
{

let d=new Date();


document.getElementById(
"clock"
).innerHTML =
d.toLocaleTimeString();



document.getElementById(
"date"
).innerHTML =
d.toDateString();

}


setInterval(clock,1000);

clock();







// SAVE BROKER


function saveBroker()
{


let ip =
document.getElementById(
"broker"
).value;



fetch(
"/api/config?broker="+ip
)



.then(
r=>r.text()
)


.then(
x=>alert(x)
);



}








// STATUS UPDATE


async function update()
{


try{


let r =
await fetch(
"/api/status"
);



let data =
await r.json();




document.getElementById(
"mqtt"
).innerHTML =
data.mqtt;



document.getElementById(
"mqtt2"
).innerHTML =
data.mqtt;



document.getElementById(
"esp"
).innerHTML =
data.ip;



document.getElementById(
"brokerView"
).innerHTML =
data.broker;



document.getElementById(
"broker"
).value =
data.broker;




document.getElementById(
"temp"
).innerHTML =
data.weather.temperature
+
"°C";



document.getElementById(
"weather"
).innerHTML =
data.weather.condition;



document.getElementById(
"humidity"
).innerHTML =
data.weather.humidity;







let box =
document.getElementById(
"curtainBox"
);



box.innerHTML="";



data.curtain.forEach(
c=>{


box.innerHTML += `


<div class="curtain">


<h3>${c.name}</h3>


<div class="bar">

<div class="fill"
style="width:${c.position}%">

</div>

</div>



<h2>
${c.position}%
</h2>


<p>
Mode:
${c.mode}
</p>


<span class="badge">
${c.state}
</span>


</div>


`;



history.push(
c.position
);



if(history.length>30)
history.shift();


drawChart();



});



}

catch(e)
{

document.getElementById(
"mqtt"
).innerHTML=
"Offline";


}



}





setInterval(
update,
3000
);


update();









// GRAPH


function drawChart()
{


let c=
document.getElementById(
"chart"
);



let ctx=
c.getContext(
"2d"
);



ctx.clearRect(
0,
0,
c.width,
c.height
);



ctx.beginPath();



history.forEach(
(v,i)=>{


let x =
i*(c.width/30);


let y =
c.height -
(v*c.height/100);



if(i==0)
ctx.moveTo(x,y);

else

ctx.lineTo(x,y);



});



ctx.stroke();



}


</script>



</body>

</html>
