<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Curtain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }

    .navbar {
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
    }

    .nav-right {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .connection-status.connected {
      background: #d4edda;
      color: #155724;
    }

    .connection-status.disconnected {
      background: #f8d7da;
      color: #721c24;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .connected .status-dot { background: #28a745; }
    .disconnected .status-dot { background: #dc3545; }

    .settings-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      background: #667eea;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px 40px;
    }

    .top-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
      border-bottom: 2px solid #e0e0e0;
    }

    .top-nav a {
      text-decoration: none;
      padding: 12px 18px;
      color: #999;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .top-nav a.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .preview-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 22px;
      text-align: center;
    }

    .curtain-icon {
      font-size: 80px;
      margin: 12px 0;
    }

    .curtain-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .curtain-mode {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #f0f0f0;
      color: #667eea;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .curtain-bar {
      height: 12px;
      background: #ededed;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .curtain-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s ease;
    }

    .curtain-position {
      font-size: 13px;
      color: #666;
      text-align: center;
    }

    .table-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #f5f5f5;
      font-size: 13px;
    }

    td {
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .on { background: #d4edda; color: #155724; }
    .off { background: #f8d7da; color: #721c24; }
    .move { background: #fff3cd; color: #856404; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 420px;
      border-radius: 12px;
      padding: 22px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-actions button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save {
      background: #667eea;
      color: white;
    }

    .btn-cancel {
      background: #e0e0e0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="title">🪟 Smart Curtain</div>
    <div class="nav-right">
      <div id="connectionStatus" class="connection-status disconnected">
        <span class="status-dot"></span>
        <span>Disconnected</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>
  </div>

  <div class="container">
    <div class="top-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="control.html">🎮 Control</a>
      <a href="status.html" class="active">📋 Status</a>
    </div>

    <div class="status-grid" id="previewGrid"></div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Curtain</th>
            <th>Mode</th>
            <th>Position</th>
            <th>State</th>
            <th>Open</th>
            <th>Closed</th>
          </tr>
        </thead>
        <tbody id="statusTable"></tbody>
      </table>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">Connection Settings</div>
      <div class="form-group">
        <label>Server / ESP32 IP</label>
        <input id="serverIP" type="text" placeholder="192.168.1.150" />
      </div>
      <div class="modal-actions">
        <button class="btn-save" onclick="saveConnection()">Save & Connect</button>
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const curtainData = [
      { name: 'Living Room', mode: 'OPEN', position: 72, moving: false, open: false, closed: false },
      { name: 'Bedroom', mode: 'MORNING', position: 50, moving: false, open: false, closed: false },
      { name: 'Kitchen', mode: 'AFTERNOON', position: 30, moving: false, open: false, closed: false },
      { name: 'Dining', mode: 'OPEN', position: 100, moving: false, open: true, closed: false },
      { name: 'Study', mode: 'EVENING', position: 12, moving: false, open: false, closed: false }
    ];

    let serverIP = localStorage.getItem('smartCurtainIp') || '';
    let connected = false;

    function updateStatusBadge() {
      const el = document.getElementById('connectionStatus');
      if (connected) {
        el.className = 'connection-status connected';
        el.innerHTML = '<span class="status-dot"></span><span>Connected</span>';
      } else {
        el.className = 'connection-status disconnected';
        el.innerHTML = '<span class="status-dot"></span><span>Disconnected</span>';
      }
    }

    function getIcon(position) {
      if (position > 70) return '🟦';
      if (position > 40) return '🟫';
      return '🪟';
    }

    function renderPreview() {
      const grid = document.getElementById('previewGrid');
      grid.innerHTML = curtainData.map(item => `
        <div class="preview-card">
          <div class="curtain-name">${item.name}</div>
          <div class="curtain-mode">${item.mode}</div>
          <div class="curtain-icon">${getIcon(item.position)}</div>
          <div class="curtain-bar">
            <div class="curtain-fill" style="width: ${item.position}%"></div>
          </div>
          <div class="curtain-position">${item.position}%</div>
        </div>
      `).join('');
    }

    function renderTable() {
      const tbody = document.getElementById('statusTable');
      tbody.innerHTML = curtainData.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>${item.mode}</td>
          <td>${item.position}%</td>
          <td>
            <span class="badge ${item.moving ? 'move' : 'off'}">${item.moving ? 'Moving' : 'Stopped'}</span>
          </td>
          <td>
            <span class="badge ${item.open ? 'on' : 'off'}">${item.open ? 'Triggered' : 'Off'}</span>
          </td>
          <td>
            <span class="badge ${item.closed ? 'on' : 'off'}">${item.closed ? 'Triggered' : 'Off'}</span>
          </td>
        </tr>
      `).join('');
    }

    function openSettings() {
      document.getElementById('serverIP').value = serverIP;
      document.getElementById('settingsModal').classList.add('show');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    function saveConnection() {
      const ip = document.getElementById('serverIP').value.trim();
      if (!ip) {
        alert('Please enter IP address');
        return;
      }

      serverIP = ip;
      localStorage.setItem('smartCurtainIp', serverIP);

      connected = true;
      updateStatusBadge();
      closeSettings();

      alert('Connected to: ' + serverIP);
    }

    renderPreview();
    renderTable();
    updateStatusBadge();
  </script>
</body>
</html>
