<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simple Web Monitoring</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Tailwind CDN for simplicity -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Web Monitoring (simulated)</h1>

    <div class="grid grid-cols-3 gap-4">
      <div class="col-span-1 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Devices</h2>
        <table id="devices-table" class="w-full text-sm">
          <thead>
            <tr>
              <th class="text-left">Name</th>
              <th class="text-left">IP</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="devices-body"></tbody>
        </table>
      </div>

      <div class="col-span-2 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Realtime Bandwidth</h2>
        <canvas id="bandwidthChart" height="120"></canvas>
        <div class="mt-2">
          <label class="text-sm">Selected device: <span id="selected-device">-</span></label>
        </div>
      </div>

      <div class="col-span-3 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Logs / Alerts</h2>
        <div id="logs" class="h-40 overflow-auto text-sm"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/main.js"></script>
</body>
</html>
