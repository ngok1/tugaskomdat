<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Curtain</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }
    .navbar {
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-chip.connected {
      background: #d4edda;
      color: #155724;
    }
    .status-chip.disconnected {
      background: #f8d7da;
      color: #721c24;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .connected .dot { background: #28a745; }
    .disconnected .dot { background: #dc3545; }

    .settings-btn {
      border: none;
      background: #667eea;
      color: white;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: 22px auto 40px;
      padding: 0 20px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .nav-tabs a {
      text-decoration: none;
      padding: 12px 18px;
      color: #999;
      font-weight: 600;
      border-bottom: 3px solid transparent;
    }
    .nav-tabs a.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .room-btn {
      padding: 14px 10px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .room-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .control-btn {
      border: none;
      border-radius: 10px;
      padding: 14px 12px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }
    .control-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.1); }

    .open { background: linear-gradient(135deg, #667eea, #764ba2); }
    .morning { background: linear-gradient(135deg, #ffa500, #ff8c00); }
    .afternoon { background: linear-gradient(135deg, #ffb347, #ffa500); }
    .evening { background: linear-gradient(135deg, #696969, #2f4f4f); }
    .closed { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .stop { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #111; }

    .custom-box {
      margin-top: 22px;
      background: #f5f5f5;
      border-radius: 10px;
      padding: 18px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] { flex: 1; }
    .slider-value { min-width: 52px; text-align: center; font-weight: bold; color: #667eea; }
    .apply-custom {
      width: 100%;
      margin-top: 14px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f5f5f5;
      text-align: center;
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 20;
      align-items: center;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      width: min(420px, 90%);
      border-radius: 12px;
      padding: 22px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .field input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-actions button {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .save-btn { background: #667eea; color: white; }
    .cancel-btn { background: #e0e0e0; color: #333; }

    @media (max-width: 700px) {
      .button-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="brand">🪟 Smart Curtain</div>
    <div class="nav-right">
      <div id="connectionState" class="status-chip disconnected">
        <span class="dot"></span>
        <span>Disconnected</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>
  </div>

  <div class="container">
    <div class="nav-tabs">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="control.html" class="active">🎮 Control</a>
      <a href="status.html">📋 Status</a>
    </div>

    <div class="panel">
      <div class="section-title">Select Room / Area</div>
      <div id="roomGrid" class="room-grid"></div>

      <div class="section-title" style="margin-top: 18px;">Preset Modes</div>
      <div class="button-grid">
        <button class="control-btn open" onclick="sendCommand('OPEN')">🟦 OPEN</button>
        <button class="control-btn morning" onclick="sendCommand('MORNING')">☀️ MORNING</button>
        <button class="control-btn afternoon" onclick="sendCommand('AFTERNOON')">🌤️ AFTERNOON</button>
        <button class="control-btn evening" onclick="sendCommand('EVENING')">🌙 EVENING</button>
        <button class="control-btn closed" onclick="sendCommand('CLOSED')">🪟 CLOSED</button>
        <button class="control-btn stop" onclick="sendCommand('STOP')">⏹️ STOP</button>
      </div>

      <div class="custom-box">
        <div style="font-weight: 600; margin-bottom: 10px;">Custom Position</div>
        <div class="slider-row">
          <input id="slider" type="range" min="0" max="100" value="0" oninput="updateSliderValue()">
          <span id="sliderValue" class="slider-value">0%</span>
        </div>
        <button class="apply-custom" onclick="applyCustom()">Apply Custom</button>
      </div>

      <div id="statusBox" class="status-box">Status: Loading...</div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">Connection Settings</div>
      <div class="field">
        <label>ESP32 / Server IP</label>
        <input id="serverIp" type="text" placeholder="192.168.1.150" />
      </div>
      <div class="modal-actions">
        <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
        <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "smartCurtainIp";
    let serverIp = localStorage.getItem(STORAGE_KEY) || "";
    let connected = false;
    let selectedRoom = "";
    let rooms = [];

    function setConnectionState(isConnected) {
      connected = isConnected;
      const el = document.getElementById("connectionState");
      if (isConnected) {
        el.className = "status-chip connected";
        el.innerHTML = '<span class="dot"></span><span>Connected</span>';
      } else {
        el.className = "status-chip disconnected";
        el.innerHTML = '<span class="dot"></span><span>Disconnected</span>';
      }
    }

    function openSettings() {
      document.getElementById("serverIp").value = serverIp;
      document.getElementById("settingsModal").classList.add("show");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("show");
    }

    function saveSettings() {
      const val = document.getElementById("serverIp").value.trim();
      if (!val) {
        alert("Masukkan IP ESP32 / server!");
        return;
      }
      serverIp = val;
      localStorage.setItem(STORAGE_KEY, serverIp);
      closeSettings();
      loadStatus();
    }

    function buildUrl(path) {
      if (!serverIp) return null;
      return "http://" + serverIp + path;
    }

    async function sendCommand(command) {
      const url = buildUrl("/api/command");
      if (!url) return;

      const payload = {
        room: selectedRoom,
        command: command
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          await loadStatus();
        } else {
          console.error("Command failed");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function applyCustom() {
      const value = Number(document.getElementById("slider").value);
      const url = buildUrl("/api/command");
      if (!url) return;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            room: selectedRoom,
            command: "CUSTOM",
            position: value
          })
        });

        if (res.ok) {
          await loadStatus();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadStatus() {
      const url = buildUrl("/api/status");
      if (!url) {
        setConnectionState(false);
        return;
      }

      try {
        const res = await fetch(url, { method: "GET" });
        if (!res.ok) throw new Error("Bad response");
        const data = await res.json();

        rooms = Array.isArray(data.rooms) ? data.rooms : [];
        if (!selectedRoom && rooms.length) {
          selectedRoom = rooms[0].name;
        }

        renderRooms();
        renderStatusBox();

        setConnectionState(true);
      } catch (err) {
        setConnectionState(false);
      }
    }

    function renderRooms() {
      const grid = document.getElementById("roomGrid");
      if (!rooms.length) {
        grid.innerHTML = "";
        return;
      }

      grid.innerHTML = rooms.map(room => `
        <button class="room-btn ${room.name === selectedRoom ? 'active' : ''}" onclick="selectRoom('${room.name}')">
          ${room.name}
        </button>
      `).join("");
    }

    function selectRoom(roomName) {
      selectedRoom = roomName;
      renderRooms();
      renderStatusBox();
    }

    function renderStatusBox() {
      const room = rooms.find(r => r.name === selectedRoom);
      if (!room) {
        document.getElementById("statusBox").textContent = "Status: No room selected";
        return;
      }

      document.getElementById("statusBox").textContent =
        `Status: ${room.mode} (${room.position}%)`;
    }

    function updateSliderValue() {
      document.getElementById("sliderValue").textContent = document.getElementById("slider").value + "%";
    }

    setConnectionState(false);
    if (serverIp) {
      loadStatus();
      setInterval(loadStatus, 2500);
    } else {
      openSettings();
    }
  </script>
</body>
</html>
