<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Curtain</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 18px;
      max-width: 500px;
      width: 100%;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      color: #667eea;
      font-size: 2.2rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .menu a {
      text-decoration: none;
      color: white;
      padding: 18px 16px;
      border-radius: 12px;
      font-weight: bold;
      display: block;
      transition: 0.2s ease;
    }
    .menu a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .dashboard { background: linear-gradient(135deg, #667eea, #764ba2); }
    .control { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .status { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #111; }
    .info {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 16px;
      color: #555;
      font-size: 13px;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪟 Smart Curtain</h1>
    <div class="subtitle">Real-time multi-room control</div>

    <div class="menu">
      <a href="dashboard.html" class="dashboard">📊 Dashboard</a>
      <a href="control.html" class="control">🎮 Control</a>
      <a href="status.html" class="status">📋 Status</a>
    </div>

    <div class="info">
      <strong>Langkah:</strong><br>
      1. Masukkan IP ESP32 di Settings<br>
      2. Klik Save & Connect<br>
      3. Buka Dashboard / Control / Status
    </div>
  </div>
</body>
</html>
