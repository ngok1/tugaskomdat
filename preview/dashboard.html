<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }
    .navbar {
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-chip.connected {
      background: #d4edda;
      color: #155724;
    }
    .status-chip.disconnected {
      background: #f8d7da;
      color: #721c24;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .connected .dot { background: #28a745; }
    .disconnected .dot { background: #dc3545; }

    .settings-btn {
      border: none;
      background: #667eea;
      color: white;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 22px auto 40px;
      padding: 0 20px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .nav-tabs a {
      text-decoration: none;
      padding: 12px 18px;
      color: #999;
      font-weight: 600;
      border-bottom: 3px solid transparent;
    }
    .nav-tabs a.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
    }
    .card-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .big-number {
      font-size: 34px;
      font-weight: bold;
      color: #667eea;
    }

    .chart-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 25px;
    }
    .chart-title {
      font-weight: 600;
      margin-bottom: 12px;
    }
    .chart {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      height: 220px;
      padding-top: 8px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bar {
      width: 100%;
      min-height: 18px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease;
    }
    .bar-label {
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .room-item {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 16px;
    }
    .room-name {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .room-mode {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
    }
    .progress {
      height: 10px;
      background: #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }
    .percent {
      text-align: center;
      color: #666;
      font-size: 12px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 20;
      align-items: center;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      width: min(420px, 90%);
      border-radius: 12px;
      padding: 22px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .field input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-actions button {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .save-btn { background: #667eea; color: white; }
    .cancel-btn { background: #e0e0e0; color: #333; }

    @media (max-width: 700px) {
      .chart { gap: 8px; }
      .room-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="brand">🪟 Smart Curtain</div>
    <div class="nav-right">
      <div id="connectionState" class="status-chip disconnected">
        <span class="dot"></span>
        <span>Disconnected</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>
  </div>

  <div class="container">
    <div class="nav-tabs">
      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="control.html">🎮 Control</a>
      <a href="status.html">📋 Status</a>
    </div>

    <div class="stats">
      <div class="card">
        <div class="card-title">Current Time</div>
        <div class="big-number" id="timeText">00:00</div>
        <div id="dateText" style="color:#777; font-size:13px; margin-top:4px;"></div>
      </div>

      <div class="card">
        <div class="card-title">Total Rooms</div>
        <div class="big-number" id="totalRooms">0</div>
      </div>

      <div class="card">
        <div class="card-title">Moving</div>
        <div class="big-number" id="movingRooms">0</div>
      </div>
    </div>

    <div class="chart-box">
      <div class="chart-title">Room Positions</div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="chart-box">
      <div class="chart-title">Room Status</div>
      <div class="room-grid" id="roomGrid"></div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">Connection Settings</div>
      <div class="field">
        <label>ESP32 / Server IP</label>
        <input id="serverIp" type="text" placeholder="192.168.1.150" />
      </div>
      <div class="modal-actions">
        <button class="save-btn" onclick="saveSettings()">Save & Connect</button>
        <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "smartCurtainIp";
    let serverIp = localStorage.getItem(STORAGE_KEY) || "";
    let connected = false;

    function setConnectionState(isConnected) {
      connected = isConnected;
      const el = document.getElementById("connectionState");
      if (isConnected) {
        el.className = "status-chip connected";
        el.innerHTML = '<span class="dot"></span><span>Connected</span>';
      } else {
        el.className = "status-chip disconnected";
        el.innerHTML = '<span class="dot"></span><span>Disconnected</span>';
      }
    }

    function openSettings() {
      document.getElementById("serverIp").value = serverIp;
      document.getElementById("settingsModal").classList.add("show");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("show");
    }

    function saveSettings() {
      const val = document.getElementById("serverIp").value.trim();
      if (!val) {
        alert("Masukkan IP ESP32 / server!");
        return;
      }
      serverIp = val;
      localStorage.setItem(STORAGE_KEY, serverIp);
      closeSettings();
      loadData();
    }

    function buildUrl(path) {
      if (!serverIp) return null;
      return "http://" + serverIp + path;
    }

    async function loadData() {
      const url = buildUrl("/api/status");
      if (!url) {
        setConnectionState(false);
        return;
      }

      try {
        const res = await fetch(url, { method: "GET" });
        if (!res.ok) throw new Error("HTTP not OK");
        const data = await res.json();

        renderDashboard(data);
        setConnectionState(true);
      } catch (err) {
        setConnectionState(false);
      }
    }

    function renderDashboard(data) {
      const roomList = Array.isArray(data.rooms) ? data.rooms : [];
      document.getElementById("totalRooms").textContent = roomList.length;

      const moving = roomList.filter(r => r.moving).length;
      document.getElementById("movingRooms").textContent = moving;

      const chartEl = document.getElementById("chart");
      chartEl.innerHTML = roomList.map(item => `
        <div class="bar-col">
          <div class="bar" style="height:${Math.max(item.position, 8) * 1.8}px"></div>
          <div class="bar-label">${item.name}</div>
        </div>
      `).join("");

      const roomGrid = document.getElementById("roomGrid");
      roomGrid.innerHTML = roomList.map(item => `
        <div class="room-item">
          <div class="room-name">${item.name}</div>
          <div class="room-mode">${item.mode}</div>
          <div class="progress">
            <div class="progress-fill" style="width:${item.position}%"></div>
          </div>
          <div class="percent">${item.position}%</div>
        </div>
      `).join("");
    }

    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("timeText").textContent = hh + ":" + mm;

      const date = now.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
      document.getElementById("dateText").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);

    setConnectionState(false);
    if (serverIp) {
      loadData();
      setInterval(loadData, 2500);
    } else {
      openSettings();
    }
  </script>
</body>
</html>
